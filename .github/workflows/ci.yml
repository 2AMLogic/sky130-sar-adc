name: CI

# Self-check inventory for this repo (see CLAUDE.md) and where each one runs:
#
#   - `package.json` `check:ci` (JSON syntax check over sim/**/*.json and
#     layout/**/*.json, shell syntax of the harness/layout scripts, python
#     compile + the sim/tests unit suite, and `sim/selftest.sh`) -> `checks`
#     job below, every push/PR. Headless: `sim/selftest.sh` runs its unit and
#     environment stages, then SKIPs its two simulation stages with exit 0
#     when ngspice/the pinned PDK are absent, which is the case in this job.
#     A *drifted* pinned toolchain never skips — it fails.
#   - The PDK-gated harness smoke test (the harness's own liveness check:
#     proves the pinned sky130 PDK models load in ngspice and that the PVT
#     and Monte Carlo knobs actually reach the simulator — including the two
#     negative controls) runs in the `pdk-smoke` job below, gated on a
#     nightly schedule / manual dispatch / an opt-in `run-pdk-smoke` label on
#     a PR, because it needs a full volare PDK fetch.
#   - The metal minimum-area gate (issue #338) also runs in `pdk-smoke`:
#     `docs/chipalooza/measure_metal_min_area.py` cross-checks sky130A's own
#     m1.6/m2.6/m3.6/m4.4a/m5.4 rules -- which the pinned klayout-tools==0.6.0
#     deck now also checks natively (`met*.area.1`, issue #103) -- against
#     each flow's current `reports/LATEST` GDS. It is PDK- and KLayout-gated,
#     and it is run with a negative control (`--self-test`) first on every
#     invocation. The gate is zero-tolerance (no baseline/waiver file): issue
#     #333, the one tool-emitted residual this measurement ever had to hold
#     out, is closed, and both this script (post-#363 fix) and the deck's own
#     rules measure 0 shapes below threshold across every target today.
#   - Everything claimed under `sim/<experiment>/records/` and
#     `layout/trivial-cell/reports/` is evidence captured by a human/agent
#     run of the PDK-gated runners, not a repeatable CI check — re-running it
#     here would mint new append-only records on every push, which is not
#     what CI is for. `pdk-smoke` therefore runs the harness WITHOUT
#     `--record`. See sim/README.md for how to reproduce a claim by hand.
#   - `design/regen_netlist.sh --check` (the SAR ADC top-level netlist
#     regeneration check, issue #56) also runs in `pdk-smoke`, for the same
#     reason as the harness smoke test: xschem netlisting the full
#     design/sar_adc_top.sch hierarchy needs the PDK models. It fails if
#     design/sar_adc_top.spice (the committed full-hierarchy netlist) does
#     not match a fresh regeneration from the current design/*.sch sources —
#     staleness is failure.
#   - `sim/check_spec_coverage.py` (issue #31, T1 item 9) is also part of
#     `check:ci` -> `checks` below, and is likewise headless (pure file
#     reads, no PDK, no ngspice): it checks that every row of
#     spec/target-spec.md's target table is indexed in sim/spec-coverage.json
#     with a committed testbench and evidence record, that each bench's
#     documented cold-start invocation is the one its record was actually
#     minted with, and that every indexed record pins the PDK commit in
#     sim/pdk.json and clears sim/toolchain.json's ngspice floor. This is the
#     always-on gate against the silent regression that item 9 grades —
#     adding one more claimed spec row without its bench, while every
#     individual campaign still looks green.
#   - `docs/chipalooza/check_proposal_citations.py` (issue #121) is also part
#     of `check:ci` -> `checks` below, and is likewise headless (pure file
#     reads, no PDK, no ngspice, no network): it gates the evidence citations
#     in docs/chipalooza/challenge-4-proposal.md -- that every path that
#     document cites resolves, that every Section 4 spec-row verdict cites the
#     CURRENT record of each sim/layout flow it rests on, and that the figures
#     quoted *out of* those records are recomputed from them rather than
#     trusted as typed. This is the always-on gate against the drift that
#     document's own history is full of -- a flow re-runs, its LATEST moves,
#     and a spec-row verdict is left citing the superseded record (PRs
#     #239/#242/#276/#282/#295/#300 each had to correct an instance after the
#     fact).
#
#     The per-check rationale -- what each numbered check exists for, and what
#     it deliberately does NOT cover -- lives in docs/citation-gate.md, which
#     sim/tests/test_proposal_citations.py keeps in step with the checker's
#     own `check_document` chain. It is NOT restated here on purpose: a second
#     narrative copy goes stale exactly the way this comment's hand-carried
#     census number did (PR #312). Neither are any of the gated figures
#     (census, DRC/LVS, power and area readouts) -- run the checker with
#     `--stats` for the live ones.
#   - `signoff/check_evidence_hashes.py` (issue #345) is also part of
#     `check:ci` -> `checks` below, and is likewise headless (pure file
#     reads + sha256, no PDK, no ngspice, no `klt`, no network): it re-derives
#     every artifact hash that signoff/block-manifest.json's citations rest on
#     directly from the committed files. This is the half of the freshness
#     contract `klt signoff` structurally CANNOT check -- the grader compares
#     a manifest's pinned content_hash against the cited envelope's own
#     SELF-REPORTED hash, so a manifest and an envelope can go on agreeing
#     with each other indefinitely while the GDS or Markdown they describe is
#     rewritten underneath them (klayout-tools#2196 surfaces that as
#     `input_verified`, which is null for every citation in this manifest).
#     Negative controls for each drift shape live in
#     sim/tests/test_signoff_evidence_hashes.py -> `npm run test:unit`.
#   - `layout/bin/check-klt-pin-evidence.sh` (issue #110) is also part of
#     `check:ci` -> `checks` below: it cross-checks the `klt` pin in
#     layout/requirements.txt against the `klt` version and overall verdict
#     stamped in the latest layout/trivial-cell/reports/ record, headlessly
#     (no PDK, no `klt` install). This is the always-on gate that catches a
#     PR moving the pin without fresh matching evidence -- the class of
#     regression PR #108 caused and #104 fixed, when the six-verdict proof
#     itself only runs in the PDK-gated `pdk-smoke` job below.
#   - `layout/bin/check_drc_evidence.py` (issue #121) is also part of
#     `check:ci` -> `checks` below, and is likewise headless (pure file reads,
#     no PDK, no `klt` install): it holds every DRC payload a layout flow's
#     own reports/LATEST resolves to -- the evidence every "DRC-clean" claim
#     in this repo, and every verdict docs/chipalooza/challenge-4-proposal.md
#     grades on them, actually stands on -- to curated-deck provenance. A
#     payload stamped with an `engine` / a deck *file* came from `klt drc
#     --engine klayout --deck-file`, the path klayout-tools#1941 showed can
#     report `status: "clean"` from a deck that aborted part-way through (a
#     report file covering only the rules that ran before the abort). That
#     fix, klayout-tools#1951, is merged but in no published release (`klt`
#     0.5.0 remains latest), so the affected behaviour is what a `klt drc`
#     run here does today. The gate also rejects a payload carrying
#     `engine_deck_errors` (#1951's own `--allow-deck-errors` marker, i.e. a
#     knowingly partial run) and a `clean` verdict whose coverage block names
#     no checked layer. Superseded records are deliberately out of scope --
#     layout/ evidence is append-only, and this repo does hold one payload of
#     exactly that shape from a klt 0.3.0 n-well recipe the curated deck
#     later made unnecessary; what the gate requires is that nothing of that
#     shape is what a verdict stands on TODAY. Finding no payload at all
#     fails too, so a renamed directory cannot turn it into a silent pass.
#   - `sim/tests/test_measure_metal_min_area.py` (issue #363) runs as its own
#     step of `checks` below rather than inside `check:ci`, because it is this
#     repo's only unit test that needs the KLayout *engine* -- `npm run
#     test:unit`'s interpreter has no `klayout` module and skips it. It needs
#     no PDK (inline rule table, synthesised GDS), so the step just installs
#     layout/requirements.txt's own `klayout==` pin into a throwaway venv. It
#     pins the region construction `docs/chipalooza/measure_metal_min_area.py`
#     uses: the pre-#363 `Region().insert(iter)` form under-merged, because
#     KLayout's merge is property-aware and this repo's routed GDS carries
#     net-name properties on PDN straps but not on the via cells inside them,
#     so covered via pads were reported as minimum-area violations. That wrong
#     count stood for four days -- in two flow READMEs and in issue #333's
#     waiver -- while the pinned deck's own `met*.area.1` rules reported 0 on
#     the same GDS. Nothing cross-checked the two; this step is that check.
#   - `signoff/run-signoff.sh --check` (issue #345) runs in its OWN
#     `signoff-check` job below rather than in `check:ci`, for one reason: it
#     is the only PR-blocking check that needs `klt` installed. Everything it
#     does is still a pure JSON+Markdown transform -- no PDK, no KLayout
#     engine, no GDS read -- so it belongs on the PR-blocking path next to the
#     other citation gates, not in the nightly. It re-grades
#     signoff/block-manifest.json with the pinned grader and fails if the
#     committed signoff/t1-report.json no longer reproduces, so a manifest
#     citing an artifact that has since changed (or a checklist/grader move,
#     or a manifest edit with no re-render) turns THIS run red the same day
#     instead of rotting until a human re-reads a prose tracker by hand --
#     the exact staleness mode issue #345 was filed against.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: Repo checks (headless, no PDK)
    # Route to the shared self-hosted fleet runner (2am#29) for same-repo
    # events, falling back to ubuntu-latest for fork PRs — untrusted fork code
    # must never execute on a self-hosted runner. Mirrors the expression in
    # 2AMLogic/klayout-tools#1246.
    #
    # This is not a speed change: GitHub-hosted minutes are billed for PRIVATE
    # repos, and this org's Actions billing is currently blocked ("The job was
    # not started because recent account payments have failed…", see #51). Every
    # run in this repo has failed at startup since 2026-08-20 while public
    # sibling repos — billed differently — stayed green. Self-hosted minutes are
    # not billed, so this restores CI here independently of the billing fix.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: npm run check:ci
        run: npm run check:ci

      # sim/tests/test_measure_metal_min_area.py is the ONE unit test in this
      # repo that needs the KLayout engine, so `npm run test:unit`'s
      # interpreter skips it and it would otherwise never run anywhere
      # (issue #363: the measurement it pins was wrong for four days precisely
      # because nothing cross-checked it). It needs NO PDK -- the rule table is
      # supplied inline and the GDS is synthesised in a temp dir -- so it
      # belongs in this headless job rather than the PDK-gated `pdk-smoke` one.
      #
      # The engine pin is READ from layout/requirements.txt rather than
      # restated here, so this step cannot drift from the version that mints
      # the evidence. Installed into a venv rather than `pip install --user`,
      # for the same reason `signoff-check` below does: the self-hosted
      # runner's interpreter may be externally managed (PEP 668).
      - name: Region-construction regression test (pinned KLayout engine, no PDK)
        run: |
          KLAYOUT_PIN="$(grep -E '^klayout==' layout/requirements.txt)"
          echo "Installing $KLAYOUT_PIN"
          python3 -m venv /tmp/venv-klayout
          /tmp/venv-klayout/bin/pip install --quiet "$KLAYOUT_PIN"
          /tmp/venv-klayout/bin/python -m unittest discover \
            --start-directory sim/tests --top-level-directory sim/tests \
            --pattern 'test_measure_metal_min_area.py' --verbose

  signoff-check:
    name: T1 tier-report staleness gate (klt signoff --manifest)
    # Same runner expression as `checks` above, and for the same reason: this
    # org's Actions billing is blocked for GitHub-hosted minutes on private
    # repos (see that job's comment and #51), so a PR-blocking job MUST route
    # to the self-hosted fleet runner for same-repo events. Fork PRs fall back
    # to ubuntu-latest — untrusted fork code never runs on a self-hosted
    # runner — where this job needs nothing but Python and pip.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately NOT layout/requirements.txt's pin (0.5.0 there, 0.6.0
      # here). The two gate different things: that one MINTS the DRC/LVS
      # evidence and only moves with a full re-run of every layout/ flow,
      # while this one GRADES it and reads no PDK, no KLayout engine and no
      # GDS. 0.6.0 is the first PyPI release whose bundled checklist carries
      # the eleventh T1 item (klayout-tools#2025, added 2026-09-17) and the
      # first with `klt signoff --check`. Full rationale, including why moving
      # this pin is a claim change rather than a chore:
      # signoff/requirements.txt.
      #
      # Installed into a venv rather than `pip install --user`: the
      # self-hosted runner's interpreter may be externally managed (PEP 668),
      # where a --user install fails outright.
      - name: Install the pinned signoff grader
        run: |
          python3 -m venv /tmp/venv-signoff
          /tmp/venv-signoff/bin/pip install --quiet -r signoff/requirements.txt
          /tmp/venv-signoff/bin/klt --version

      # `klt signoff --check` rather than a byte-diff of a fresh render: the
      # report's `build` block names how an install was provisioned, so two
      # legitimate installs of the same pinned version disagree on it
      # byte-for-byte while grading identically (klayout-tools#2249).
      # --check excludes exactly that block and compares everything else,
      # printing a per-field drift list when a row's verdict moved.
      - name: Re-grade the manifest and verify the committed tier report
        run: KLT=/tmp/venv-signoff/bin/klt bash signoff/run-signoff.sh --check

  pdk-smoke:
    name: PDK-gated harness smoke test (nightly / workflow_dispatch / 'run-pdk-smoke' label)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-smoke'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xschem + ngspice build deps
        # Neither tool comes from apt (issue #116): ubuntu-latest's xschem
        # package (3.4.4-1 as of this comment) is OLDER than
        # sim/toolchain.json's `xschem_tag` pin (3.4.7) and, critically, does
        # NOT evaluate the sky130 PDK symbols' `tcleval()`-wrapped parametric
        # properties (ad/as/pd/ps/nrd/nrs on every MOS device) into concrete
        # numbers the way 3.4.7 does -- it emits the raw, unevaluated Tcl
        # expression text into the netlist instead, which is not valid SPICE.
        # This was invisible until this issue's investigation because
        # `pdk-smoke` had never actually run end to end before: apt's xschem
        # also prints extra PDK-banner/ERC/comment-echo chatter to
        # stdout/stderr that design/regen_netlist.sh's "expect none" check
        # (now tolerant of it, see that script) took as a hard failure before
        # ever reaching the parametric-expression difference. Building the
        # exact pinned tag from source (verified locally against this repo's
        # own design/sar_adc_top.spice: a fresh `--check` run against the
        # source-built 3.4.7 matches byte-for-byte) is the only build that
        # produces a netlist this repo's own regeneration check can trust --
        # matching the same "apt is too old, build the pinned version"
        # rationale already used for ngspice below, not a new pattern.
        #
        # ngspice does NOT come from apt either. ubuntu-latest ships
        # ngspice-42, below sim/toolchain.json's `ngspice_min_major` floor,
        # and the harness correctly refuses to simulate on a drifted
        # toolchain -- numbers from it would not be comparable with the
        # records already in sim/. Lowering the pin to match whatever apt
        # happens to ship would be relaxing the gate to make the check pass,
        # which is precisely what CLAUDE.md forbids; so CI builds a version
        # that meets the floor instead. Both builds are cached, so this costs
        # a few minutes once per pin bump.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex \
            libreadline-dev libx11-dev libxaw7-dev libxpm-dev \
            libxrender-dev libcairo2-dev tcl-dev tk-dev gawk \
            automake libtool

      - name: Resolve the pinned xschem version
        id: xschem-pin
        # xschem_tag is the bare version-number git tag this repo's own
        # xschem release uses (e.g. "3.4.7") -- see sim/toolchain.json.
        run: |
          V="$(python3 -c 'import json;print(json.load(open("sim/toolchain.json"))["xschem_tag"])')"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Cache xschem build
        id: cache-xschem
        uses: actions/cache@v4
        with:
          path: /opt/xschem
          key: xschem-${{ steps.xschem-pin.outputs.version }}-${{ runner.os }}

      - name: Build xschem ${{ steps.xschem-pin.outputs.version }} from source
        if: steps.cache-xschem.outputs.cache-hit != 'true'
        run: |
          V="${{ steps.xschem-pin.outputs.version }}"
          curl -fsSL -o /tmp/xschem.tar.gz \
            "https://github.com/StefanSchippers/xschem/archive/refs/tags/${V}.tar.gz"
          mkdir -p /tmp/xschem-src
          tar -xzf /tmp/xschem.tar.gz -C /tmp/xschem-src --strip-components=1
          cd /tmp/xschem-src
          ./configure --prefix=/opt/xschem
          make -j"$(nproc)"
          make install

      - name: Put the built xschem on PATH
        run: |
          echo "/opt/xschem/bin" >> "$GITHUB_PATH"

      - name: Resolve the pinned ngspice version
        id: ngspice-pin
        # `ngspice_reference` is the version this repo's committed records were
        # produced with, so the nightly proof runs on the same simulator the
        # evidence trail was minted on. `ngspice_min_major` stays the actual
        # gate the harness enforces at run time.
        run: |
          V="$(python3 -c 'import json;print(json.load(open("sim/toolchain.json"))["ngspice_reference"])')"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Cache ngspice build
        id: cache-ngspice
        uses: actions/cache@v4
        with:
          path: /opt/ngspice
          key: ngspice-${{ steps.ngspice-pin.outputs.version }}-${{ runner.os }}

      - name: Build ngspice ${{ steps.ngspice-pin.outputs.version }} from source
        if: steps.cache-ngspice.outputs.cache-hit != 'true'
        run: |
          V="${{ steps.ngspice-pin.outputs.version }}"
          curl -fsSL -o /tmp/ngspice.tar.gz \
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${V}/ngspice-${V}.tar.gz/download"
          mkdir -p /tmp/ngspice-src
          tar -xzf /tmp/ngspice.tar.gz -C /tmp/ngspice-src --strip-components=1
          cd /tmp/ngspice-src
          ./configure --prefix=/opt/ngspice --without-x --disable-debug \
            --enable-xspice
          make -j"$(nproc)"
          make install

      - name: Put the built ngspice on PATH
        run: |
          echo "/opt/ngspice/bin" >> "$GITHUB_PATH"

      - name: Install volare
        run: pip install volare

      - name: Fetch + enable the pinned sky130 PDK
        # The pin lives in sim/pdk.json (open_pdks_commit) so CI and
        # docs/environment-setup.md cannot drift apart; the harness itself
        # re-checks the resolved commit against sim/toolchain.json and fails
        # on drift rather than silently producing incomparable numbers.
        run: |
          PDK_COMMIT="$(python3 -c 'import json;print(json.load(open("sim/pdk.json"))["open_pdks_commit"])')"
          volare enable --pdk sky130 "$PDK_COMMIT"

      - name: Harness acceptance test (PVT + Monte Carlo + both negative controls)
        # --require-pdk turns the "tools unavailable, skipping" path into a
        # failure: in this job the PDK is installed above, so a skip here
        # would mean the install silently failed.
        run: ./sim/selftest.sh --require-pdk

      - name: SAR ADC top-level netlist regeneration check (issue #56)
        # design/regen_netlist.sh --check re-derives design/sar_adc_top.spice
        # (the full-hierarchy netlist: design/sar_adc_top.sch instantiating
        # sampling_frontend/cdac_array/comparator/sar_sequencer, #52-#55) from
        # the current schematic sources and fails if the committed netlist is
        # stale -- staleness is failure, per this issue's AC4. xschem
        # netlisting needs the PDK models this job already fetched above, so
        # this check is necessarily gated the same as the rest of this job
        # (nightly/workflow_dispatch/'run-pdk-smoke' label), not run on every
        # ordinary PR -- see design/sar_adc_top.sch's own header and this
        # issue's PR description for why.
        run: |
          source sim/env.sh
          ./design/regen_netlist.sh --check

      - name: Layout DRC/LVS trivial-cell proof
        run: |
          ./layout/bin/setup-venv.sh
          ./layout/bin/run-trivial-cell-flow.sh

      - name: Metal minimum-area gate (issue #338)
        # `klt drc --deck sky130` now checks m1.6/m2.6/m3.6/m4.4a/m5.4
        # natively (klayout-tools#1989, in the pinned klayout-tools==0.6.0
        # deck since issue #103) -- but it only ever re-checks a record when
        # someone re-runs a layout flow by hand and commits the result.
        # docs/chipalooza/measure_metal_min_area.py is kept as an independent
        # cross-check of the SAME rules, applied directly to the
        # already-committed GDS in each flow's current reports/LATEST record
        # on every push down this path -- so it re-runs no layout flow (costs
        # seconds, not minutes) and, being a second implementation of the same
        # check, would itself disagree with `klt drc` if either one had a bug
        # (which is exactly how issue #363's under-merge defect in THIS
        # script, not the deck, was found). Issue #326 used it to find and fix
        # 17 real violations this repo's own generators drew; THIS step is
        # what stops the next one landing silently.
        #
        # It belongs in this job, not in `checks`, for the same reason
        # everything else here does: it needs the pinned PDK deck (above) and
        # the `klayout` module from layout/.venv (installed by the previous
        # step's setup-venv.sh).
        #
        # --self-test FIRST, deliberately: a clean verdict means nothing until
        # "fails" is shown reachable on the same rules in the same run, the
        # same falsifiability discipline layout/*/README.md's negative-control
        # verdicts apply to every other layout claim here. It measures a
        # deliberately-illegal fixture (one isolated sub-m3.6 square,
        # attributed to `cdac-array`) and exits non-zero unless the gate
        # catches it.
        #
        # No baseline/waiver argument: the gate is zero-tolerance. It had one
        # real case to design against -- 145 shapes `klt`'s own
        # place-and-route emitted inside the two PnR'd digital macros, tracked
        # as issue #333 (klayout-tools#2072 upstream) -- but #363 found that
        # figure was itself a measurement bug in this script (an under-merged
        # region double-counting via pads a PDN strap already covers), not
        # geometry `klt` drew; the corrected script and the deck's own
        # `met*.area.1` rules both report 0 shapes below threshold on every
        # target today, and #333 is closed. See
        # layout/sar-adc-top/README.md's "Minimum-area rules" section for the
        # full trace.
        run: |
          ./layout/.venv/bin/python docs/chipalooza/measure_metal_min_area.py --self-test
          ./layout/.venv/bin/python docs/chipalooza/measure_metal_min_area.py
