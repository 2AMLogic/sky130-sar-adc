name: CI

# Self-check inventory for this repo (see CLAUDE.md) and where each one runs:
#
#   - `package.json` `check:ci` (JSON syntax check over sim/**/*.json and
#     layout/**/*.json, shell syntax of loom.sh, plus python compile/unit
#     checks over sim/ and layout/) -> `checks` job below, every push/PR.
#     Headless, no PDK needed. `sim/` and `layout/` are currently empty
#     scaffolding (see #2), so these checks are no-ops until real content
#     lands there.
#   - The PDK-gated harness smoke test (the harness's own liveness check:
#     proves the pinned sky130 PDK models load in ngspice, xschem netlists
#     headlessly, and the PVT knobs actually reach the simulator) is not
#     implemented yet — the `pdk-smoke` job below is a placeholder, gated the
#     way the real check will be (nightly schedule / manual dispatch / opt-in
#     `run-pdk-smoke` label on a PR) so #2 can fill in its actual steps
#     without restructuring the trigger conditions.
#   - Everything claimed under `sim/<experiment>/` (once #2 lands it) is
#     evidence captured by a human/agent run of the PDK-gated runner, not a
#     repeatable CI check — re-running it here would mint new append-only
#     records on every push, which is not what CI is for. See sim/README.md
#     (once it exists) for how to reproduce a claim by hand.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: Repo checks (headless, no PDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install klayout
        # A pure-manylinux wheel (no PDK, no layout/.venv needed) -- installed
        # ahead of #2 landing layout/tests/, which will need the klayout
        # python module for the routed-layout flow's DRC-style checks.
        run: pip install klayout

      - name: npm run check:ci
        run: npm run check:ci

  pdk-smoke:
    name: PDK-gated harness smoke test (nightly / workflow_dispatch / 'run-pdk-smoke' label)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-smoke'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ngspice + xschem
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice xschem

      - name: Install volare
        run: pip install --user volare

      - name: PDK-smoke harness (not yet implemented, see #2)
        # This job is gated the same way the real PDK-smoke check will be
        # (schedule / workflow_dispatch / run-pdk-smoke label), so #2 can
        # replace this placeholder with the actual `sim/bin/corner-run.py
        # sim/pdk-smoke` invocation (reading sim/pdk.json for the pinned
        # open_pdks commit) without touching the trigger conditions above.
        run: |
          echo "PDK-smoke harness not implemented yet -- see #2."
          echo "sim/bin/corner-run.py and sim/pdk.json do not exist in this repo yet."
