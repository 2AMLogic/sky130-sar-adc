name: CI

# Self-check inventory for this repo (see CLAUDE.md) and where each one runs:
#
#   - `package.json` `check:ci` (JSON syntax check over sim/**/*.json and
#     layout/**/*.json, shell syntax of the harness/layout scripts, python
#     compile + the sim/tests unit suite, and `sim/selftest.sh`) -> `checks`
#     job below, every push/PR. Headless: `sim/selftest.sh` runs its unit and
#     environment stages, then SKIPs its two simulation stages with exit 0
#     when ngspice/the pinned PDK are absent, which is the case in this job.
#     A *drifted* pinned toolchain never skips — it fails.
#   - The PDK-gated harness smoke test (the harness's own liveness check:
#     proves the pinned sky130 PDK models load in ngspice and that the PVT
#     and Monte Carlo knobs actually reach the simulator — including the two
#     negative controls) runs in the `pdk-smoke` job below, gated on a
#     nightly schedule / manual dispatch / an opt-in `run-pdk-smoke` label on
#     a PR, because it needs a full volare PDK fetch.
#   - Everything claimed under `sim/<experiment>/records/` and
#     `layout/trivial-cell/reports/` is evidence captured by a human/agent
#     run of the PDK-gated runners, not a repeatable CI check — re-running it
#     here would mint new append-only records on every push, which is not
#     what CI is for. `pdk-smoke` therefore runs the harness WITHOUT
#     `--record`. See sim/README.md for how to reproduce a claim by hand.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: Repo checks (headless, no PDK)
    # Route to the shared self-hosted fleet runner (2am#29) for same-repo
    # events, falling back to ubuntu-latest for fork PRs — untrusted fork code
    # must never execute on a self-hosted runner. Mirrors the expression in
    # 2AMLogic/klayout-tools#1246.
    #
    # This is not a speed change: GitHub-hosted minutes are billed for PRIVATE
    # repos, and this org's Actions billing is currently blocked ("The job was
    # not started because recent account payments have failed…", see #51). Every
    # run in this repo has failed at startup since 2026-08-20 while public
    # sibling repos — billed differently — stayed green. Self-hosted minutes are
    # not billed, so this restores CI here independently of the billing fix.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: npm run check:ci
        run: npm run check:ci

  pdk-smoke:
    name: PDK-gated harness smoke test (nightly / workflow_dispatch / 'run-pdk-smoke' label)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-smoke'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xschem + ngspice build deps
        # xschem comes from apt: it only netlists schematics, and every record
        # pins the netlist it actually ran by SHA-256, so an xschem version
        # difference is reported as a warning by `--check-env` rather than
        # blocking the run (see sim/harness/toolchain.py).
        #
        # ngspice does NOT come from apt. ubuntu-latest ships ngspice-42,
        # below sim/toolchain.json's `ngspice_min_major` floor, and the
        # harness correctly refuses to simulate on a drifted toolchain --
        # numbers from it would not be comparable with the records already in
        # sim/. Lowering the pin to match whatever apt happens to ship would
        # be relaxing the gate to make the check pass, which is precisely what
        # CLAUDE.md forbids; so CI builds a version that meets the floor
        # instead. Cached, so this costs ~2 minutes once per pin bump.
        run: |
          sudo apt-get update
          sudo apt-get install -y xschem build-essential bison flex \
            libreadline-dev libx11-dev libxaw7-dev automake libtool

      - name: Resolve the pinned ngspice version
        id: ngspice-pin
        # `ngspice_reference` is the version this repo's committed records were
        # produced with, so the nightly proof runs on the same simulator the
        # evidence trail was minted on. `ngspice_min_major` stays the actual
        # gate the harness enforces at run time.
        run: |
          V="$(python3 -c 'import json;print(json.load(open("sim/toolchain.json"))["ngspice_reference"])')"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Cache ngspice build
        id: cache-ngspice
        uses: actions/cache@v4
        with:
          path: /opt/ngspice
          key: ngspice-${{ steps.ngspice-pin.outputs.version }}-${{ runner.os }}

      - name: Build ngspice ${{ steps.ngspice-pin.outputs.version }} from source
        if: steps.cache-ngspice.outputs.cache-hit != 'true'
        run: |
          V="${{ steps.ngspice-pin.outputs.version }}"
          curl -fsSL -o /tmp/ngspice.tar.gz \
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${V}/ngspice-${V}.tar.gz/download"
          mkdir -p /tmp/ngspice-src
          tar -xzf /tmp/ngspice.tar.gz -C /tmp/ngspice-src --strip-components=1
          cd /tmp/ngspice-src
          ./configure --prefix=/opt/ngspice --without-x --disable-debug \
            --enable-xspice
          make -j"$(nproc)"
          make install

      - name: Put the built ngspice on PATH
        run: |
          echo "/opt/ngspice/bin" >> "$GITHUB_PATH"

      - name: Install volare
        run: pip install volare

      - name: Fetch + enable the pinned sky130 PDK
        # The pin lives in sim/pdk.json (open_pdks_commit) so CI and
        # docs/environment-setup.md cannot drift apart; the harness itself
        # re-checks the resolved commit against sim/toolchain.json and fails
        # on drift rather than silently producing incomparable numbers.
        run: |
          PDK_COMMIT="$(python3 -c 'import json;print(json.load(open("sim/pdk.json"))["open_pdks_commit"])')"
          volare enable --pdk sky130 "$PDK_COMMIT"

      - name: Harness acceptance test (PVT + Monte Carlo + both negative controls)
        # --require-pdk turns the "tools unavailable, skipping" path into a
        # failure: in this job the PDK is installed above, so a skip here
        # would mean the install silently failed.
        run: ./sim/selftest.sh --require-pdk

      - name: Layout DRC/LVS trivial-cell proof
        run: |
          ./layout/bin/setup-venv.sh
          ./layout/bin/run-trivial-cell-flow.sh
